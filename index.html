
<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diet Diary / Dnevnik Ishrane</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --danger-text: #991b1b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .lang-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select, input, button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    button.secondary:hover { background: #d1d5db; }

    button.danger {
      background: #dc2626;
      padding: 6px 10px;
      font-size: 0.875rem;
    }

    button.danger:hover { background: #b91c1c; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .error-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
      display: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 120px auto;
      gap: 10px;
      align-items: end;
    }

    @media (max-width: 760px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field label {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
    }

    .totals-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .totals-grid { grid-template-columns: 1fr; }
    }

    .total-item {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .total-label {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .total-val {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
    }

    .status-note {
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="appTitle">Dnevnik ishrane — K, P, Na</h1>
      <div class="lang-box no-print">
        <label for="langSelect" id="langLabel">Jezik:</label>
        <select id="langSelect">
          <option value="sr">Srpski</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
    </header>

    <div id="errorBox" class="error-box"></div>

    <section class="card no-print">
      <div class="form-grid">
        <div class="field">
          <label for="searchInput" id="searchLabel">Pretraga</label>
          <input id="searchInput" type="text" placeholder="Unesi naziv..." autocomplete="off" />
        </div>
        <div class="field">
          <label for="foodSelect" id="foodLabel">Namirnica (na 100 g)</label>
          <select id="foodSelect"></select>
        </div>
        <div class="field">
          <label for="gramsInput" id="gramsLabel">Količina (g)</label>
          <input id="gramsInput" type="number" min="1" step="any" value="100" />
        </div>
        <div class="field">
          <button id="addBtn" type="button">Dodaj</button>
        </div>
      </div>
      <div class="status-note" id="dbStatus" style="margin-top: 10px;">Učitavanje baze...</div>
    </section>

    <section class="card">
      <div class="totals-grid">
        <div class="total-item">
          <div class="total-label" id="kLabel">Kalijum (K)</div>
          <div class="total-val" id="totalK">0 mg</div>
        </div>
        <div class="total-item">
          <div class="total-label" id="pLabel">Fosfor (P)</div>
          <div class="total-val" id="totalP">0 mg</div>
        </div>
        <div class="total-item">
          <div class="total-label" id="naLabel">Natrijum (Na)</div>
          <div class="total-val" id="totalNa">0 mg</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th id="thFood">Namirnica</th>
            <th class="num" id="thGrams">Količina (g)</th>
            <th class="num">K (mg)</th>
            <th class="num">P (mg)</th>
            <th class="num">Na (mg)</th>
            <th class="num no-print" id="thAction">Ukloni</th>
          </tr>
        </thead>
        <tbody id="diaryBody"></tbody>
      </table>

      <div class="actions-bar no-print">
        <button id="clearBtn" class="secondary" type="button">Isprazni listu</button>
        <button id="printBtn" type="button">Sačuvaj / Štampaj PDF</button>
      </div>
    </section>
  </div>
